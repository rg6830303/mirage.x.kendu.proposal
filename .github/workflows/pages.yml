name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/mirage-kendu-repo-setup-ac3l2b]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html run-video.mp4 .nojekyll _site/

      # Publishing to gh-pages is what brings the site up: the workflow token
      # is not allowed to create a Pages site through the Pages API, but
      # GitHub enables Pages for the repo by itself once a gh-pages branch
      # exists. The branch is rebuilt from scratch each run so its history
      # does not grow with copies of the video.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Pushed the site to gh-pages." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable Pages if it is not on yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages is already enabled."
          else
            echo "--- trying build_type=legacy on gh-pages ---"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
              -f 'build_type=legacy' -f 'source[branch]=gh-pages' -f 'source[path]=/' || true
            echo "--- trying build_type=workflow ---"
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
              -f 'build_type=workflow' || true
          fi

      - name: Report the Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || echo none)
          if [ "$url" = none ]; then
            echo "NOT ENABLED. Set Settings > Pages source to 'Deploy from a branch' -> gh-pages / (root)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
          fi
