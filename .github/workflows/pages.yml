name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/mirage-kendu-repo-setup-ac3l2b]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html run-video.mp4 og-image.jpg .nojekyll _site/

      # This is the step that actually serves the site: Pages is set to
      # "Deploy from a branch" on gh-pages, and this rebuilds that branch from
      # scratch each run so its history does not fill up with copies of the
      # video.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "Pushed the site to gh-pages." >> "$GITHUB_STEP_SUMMARY"

      # Creating a Pages site for the first time is refused for the Actions
      # token ("Resource not accessible by integration"), so it is a one-time
      # manual step unless a PAT with the Pages scope is stored as the
      # PAGES_TOKEN secret, in which case this turns Pages on by itself.
      - name: Enable Pages if it is not on yet
        env:
          GH_TOKEN: ${{ secrets.PAGES_TOKEN || github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "Pages is already enabled."
          elif gh api -X POST "repos/$GITHUB_REPOSITORY/pages" \
                 -f 'build_type=legacy' \
                 -f 'source[branch]=gh-pages' -f 'source[path]=/'; then
            echo "Enabled Pages on gh-pages." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Pages is not enabled yet"
              echo
              echo "The Actions token is not allowed to create a Pages site."
              echo "Open **Settings → Pages**, set the source to"
              echo "**Deploy from a branch → \`gh-pages\` / (root)**, and the"
              echo "site goes live. Every later push deploys automatically."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report the Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || echo none)
          [ "$url" = none ] || echo "Live at $url" >> "$GITHUB_STEP_SUMMARY"
