name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/mirage-kendu-repo-setup-ac3l2b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html run-video.mp4 .nojekyll _site/

      # enablement turns Pages on and sets its source to GitHub Actions, so no
      # manual trip to Settings > Pages is needed for the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
